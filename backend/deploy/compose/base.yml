version: "3.8"

services:


  api-gateway:
    build:
      context: ../../../infrastructure/api-gateway
    container_name: ivyarc-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ""
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-}
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_REDIS_HOST: ${REDIS_HOST}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      EUREKA_CLIENT_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/auth-service/**
      SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: StripPrefix=1
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: authorization
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://authorization-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/authorization-service/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0: StripPrefix=1
      ZIPKIN_BASE_URL: ${ZIPKIN_BASE_URL:-}
    depends_on: {}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - ivyarc
    extra_hosts:
      - "host.docker.internal:host-gateway"

  auth-service:
    build:
      context: ../../../core-services/auth-service
    container_name: ivyarc-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ""
      SPRING_CLOUD_CONFIG_URI: ""
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${AUTH_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_ENABLED: "false"
    depends_on: {}
    networks:
      - ivyarc
    extra_hosts:
      - "host.docker.internal:host-gateway"

  authorization-service:
    build:
      context: ../../../core-services/authorization-service
    container_name: ivyarc-authorization-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ""
      SPRING_CLOUD_CONFIG_URI: ""
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${AUTHZ_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTHZ_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTHZ_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_ENABLED: "false"
    depends_on: {}
    networks:
      - ivyarc
    extra_hosts:
      - "host.docker.internal:host-gateway"

  user-management-service:
    build:
      context: ../../../core-services/user-management-service
    container_name: ivyarc-user-management-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ""
      SPRING_CLOUD_CONFIG_URI: ""
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${USER_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      EUREKA_CLIENT_ENABLED: "false"
    depends_on: {}
    networks:
      - ivyarc
    extra_hosts:
      - "host.docker.internal:host-gateway"

  audit-service:
    build:
      context: ../../../core-services/audit-service
    container_name: ivyarc-audit-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ""
      SPRING_CLOUD_CONFIG_URI: ""
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${AUDIT_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUDIT_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUDIT_DATABASE_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      EUREKA_CLIENT_ENABLED: "false"
    depends_on: {}
    networks:
      - ivyarc
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  ivyarc:
    driver: bridge
