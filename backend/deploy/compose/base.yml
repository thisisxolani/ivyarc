version: "3.8"

services:
  eureka-server:
    build:
      context: ../../infrastructure/service-discovery
    container_name: ivyarc-eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ivyarc

  config-server:
    build:
      context: ../../infrastructure/config-server
    container_name: ivyarc-config-server
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_SERVER_GIT_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_SERVER_GIT_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_SERVER_GIT_PASSWORD}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_SERVER_GIT_BRANCH:-main}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ivyarc

  api-gateway:
    build:
      context: ../../infrastructure/api-gateway
    container_name: ivyarc-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      ZIPKIN_BASE_URL: ${ZIPKIN_BASE_URL:-}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - ivyarc

  auth-service:
    build:
      context: ../../core-services/auth-service
    container_name: ivyarc-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${AUTH_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ivyarc

  authorization-service:
    build:
      context: ../../core-services/authorization-service
    container_name: ivyarc-authorization-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${AUTHZ_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTHZ_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTHZ_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ivyarc

  user-management-service:
    build:
      context: ../../core-services/user-management-service
    container_name: ivyarc-user-management-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${USER_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ivyarc

  audit-service:
    build:
      context: ../../core-services/audit-service
    container_name: ivyarc-audit-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${AUDIT_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUDIT_DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUDIT_DATABASE_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ivyarc

networks:
  ivyarc:
    driver: bridge

