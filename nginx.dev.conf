server {
    listen 80;
    server_name ivyarc.pro www.ivyarc.pro;

    # Reverse proxy Angular Vite dev server
    location / {
        proxy_pass http://localhost:4200;

        # Preserve host and forward client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Do not rewrite Location headers
        proxy_redirect off;
    }

    # API Gateway proxy (unchanged)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://localhost:8080/actuator/health;
        access_log off;
    }
}

# Redirect www to non-www
server {
    listen 80;
    server_name www.ivyarc.pro;
    return 301 http://ivyarc.pro$request_uri;
}

