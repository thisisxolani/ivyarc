spring:
  application:
    name: audit-service
  
  profiles:
    active: development
  main:
    allow-circular-references: true
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:audit_user}
    password: ${SPRING_DATASOURCE_PASSWORD:audit_password}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@rabbitmq:5672}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 10

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /
  forward-headers-strategy: native

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.company.audit: DEBUG
    org.springframework.amqp: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

app:
  rabbitmq:
    audit:
      queue: audit-events-queue
      exchange: audit-exchange
      routing-key: audit.events
    auth:
      queue: auth-events-queue
      exchange: auth-exchange
      routing-key: auth.events
    user:
      queue: user-events-queue
      exchange: user-exchange
      routing-key: user.events
    security:
      queue: security-events-queue
      exchange: security-exchange
      routing-key: security.events
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
spring:
  config:
    activate:
      on-profile: development
      
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_db_dev
    username: audit_user
    password: audit_password
    
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
      
logging:
  level:
    com.company.audit: DEBUG
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: production
      
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/audit_db}
    username: ${DATABASE_USERNAME:audit_user}
    password: ${DATABASE_PASSWORD}
    
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
      
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@rabbitmq:5672}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.company.audit: INFO
    org.springframework.amqp: WARN
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-circular-references: true
      
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    
  flyway:
    enabled: false
