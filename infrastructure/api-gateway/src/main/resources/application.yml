spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
    
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: http://auth-service:8081
            authorization-service:
              - uri: http://authorization-service:8082
            user-management-service:
              - uri: http://user-management-service:8083
            audit-service:
              - uri: http://audit-service:8084
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-internal
          uri: http://auth-service:8081
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1
        - id: authorization-internal
          uri: http://authorization-service:8082
          predicates:
            - Path=/authorization-service/**
          filters:
            - StripPrefix=1
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: 
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:4200"
              - "https://*.company.com"
            allowedMethods: 
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

# JWT Configuration for Gateway
security:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmToWorkProperly}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours
    issuer: ${JWT_ISSUER:auth-service}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    com.company.auth.gateway: DEBUG
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Spring Cloud API Gateway with Rate Limiting and Security
    java:
      version: ${java.version}

management.tracing:
  sampling:
    probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

spring:
  redis:
    host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
    port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
