server {
  listen 80;
  server_name ivyarc.pro www.ivyarc.pro;
  return 301 https://ivyarc.pro$request_uri;
}

server {
  listen 443 ssl http2;
  server_name ivyarc.pro;

  # TLS certs (managed externally; adjust paths as needed)
  ssl_certificate /etc/letsencrypt/live/ivyarc.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ivyarc.pro/privkey.pem;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Root directory for frontend built assets (outside /root for nginx permissions)
  root /var/www/ivyarc;
  index index.html;

  # Frontend routing
  location / {
    try_files $uri $uri/ /index.html;
    expires 1d;
    add_header Cache-Control "public, immutable";
  }

  # API Gateway proxy
  location /api/ {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # Health check endpoints
  location /health {
    proxy_pass http://localhost:8080/actuator/health;
    access_log off;
  }

  # Static assets optimization
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
      application/atom+xml
      application/geo+json
      application/javascript
      application/x-javascript
      application/json
      application/ld+json
      application/manifest+json
      application/rdf+xml
      application/rss+xml
      application/xhtml+xml
      application/xml
      font/eot
      font/otf
      font/ttf
      image/svg+xml
      text/css
      text/javascript
      text/plain
      text/xml;

  # Security and performance
  client_max_body_size 10M;
  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Logging
  access_log /var/log/nginx/ivyarc.access.log;
  error_log /var/log/nginx/ivyarc.error.log;
}
